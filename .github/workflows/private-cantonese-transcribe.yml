name: Private Cantonese transcription

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-cantonese-transcribe.yml'

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish ephemeral public key
        run: |
          set -euo pipefail
          mkdir -p transcription_exchange
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/private.pem -pubout -out transcription_exchange/public.pem >/dev/null 2>&1
          printf '{"state":"waiting_for_encrypted_audio"}\n' > transcription_exchange/status.json
          git config user.name 'private-transcription-bot'
          git config user.email 'private-transcription-bot@users.noreply.github.com'
          git add transcription_exchange/public.pem transcription_exchange/status.json
          git commit -m 'Publish ephemeral transcription key'
          git push origin main

      - name: Wait for encrypted request
        run: |
          set -euo pipefail
          found=0
          for _ in $(seq 1 180); do
            git pull --rebase origin main >/dev/null 2>&1 || true
            if [ -s transcription_exchange/request.json ]; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = 1

      - name: Reconstruct and decrypt audio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/audio.enc
          jq -r '.chunks[]' transcription_exchange/request.json | while read -r sha; do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 -d >> /tmp/audio.enc
          done
          jq -r '.encrypted_key_b64' transcription_exchange/request.json | base64 -d > /tmp/aes-key.enc
          openssl pkeyutl -decrypt -inkey /tmp/private.pem -in /tmp/aes-key.enc -out /tmp/aes-key.bin \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          keyhex=$(xxd -p -c 256 /tmp/aes-key.bin)
          ivhex=$(jq -r '.iv_hex' transcription_exchange/request.json)
          openssl enc -d -aes-256-cbc -K "$keyhex" -iv "$ivhex" -in /tmp/audio.enc -out /tmp/input.mp3
          ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 /tmp/input.mp3 >/tmp/duration.txt

      - name: Install local speech recognizer
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check faster-whisper

      - name: Transcribe Cantonese without exposing content in logs
        run: |
          set -euo pipefail
          cat > /tmp/transcribe.py <<'PY'
          import json
          from faster_whisper import WhisperModel

          model = WhisperModel('small', device='cpu', compute_type='int8')
          segments, info = model.transcribe(
              '/tmp/input.mp3',
              language='zh',
              beam_size=5,
              best_of=5,
              vad_filter=True,
              condition_on_previous_text=True,
              word_timestamps=True,
              initial_prompt='以下內容是香港粵語口語對話，可能包含數字、宗教、人工智能、朋友和感情話題。請按原話轉錄。',
          )
          rows = []
          text_lines = []
          for s in segments:
              row = {
                  'start': round(s.start, 3),
                  'end': round(s.end, 3),
                  'text': s.text.strip(),
                  'avg_logprob': getattr(s, 'avg_logprob', None),
                  'no_speech_prob': getattr(s, 'no_speech_prob', None),
                  'words': [
                      {
                          'start': round(w.start, 3) if w.start is not None else None,
                          'end': round(w.end, 3) if w.end is not None else None,
                          'word': w.word,
                          'probability': round(w.probability, 4),
                      }
                      for w in (s.words or [])
                  ],
              }
              rows.append(row)
              text_lines.append(f"[{s.start:07.2f} --> {s.end:07.2f}] {s.text.strip()}")
          with open('/tmp/transcript.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(text_lines) + '\n')
          with open('/tmp/segments.json', 'w', encoding='utf-8') as f:
              json.dump({'language': info.language, 'language_probability': info.language_probability, 'segments': rows}, f, ensure_ascii=False, indent=2)
          PY
          python /tmp/transcribe.py >/tmp/recognizer.log 2>&1
          test -s /tmp/transcript.txt

      - name: Encrypt transcript and publish ciphertext only
        run: |
          set -euo pipefail
          cd /tmp
          zip -q transcription-result.zip transcript.txt segments.json duration.txt
          keyhex=$(xxd -p -c 256 /tmp/aes-key.bin)
          outiv=$(openssl rand -hex 16)
          openssl enc -aes-256-cbc -K "$keyhex" -iv "$outiv" -in /tmp/transcription-result.zip -out "$GITHUB_WORKSPACE/transcription_exchange/result.enc"
          printf '{"state":"complete","iv_hex":"%s"}\n' "$outiv" > "$GITHUB_WORKSPACE/transcription_exchange/result.json"
          cd "$GITHUB_WORKSPACE"
          git pull --rebase origin main >/dev/null 2>&1 || true
          git add transcription_exchange/result.enc transcription_exchange/result.json transcription_exchange/status.json
          printf '{"state":"complete"}\n' > transcription_exchange/status.json
          git add transcription_exchange/status.json
          git commit -m 'Publish encrypted transcription result'
          git push origin main
          rm -f /tmp/private.pem /tmp/aes-key.bin /tmp/aes-key.enc /tmp/audio.enc /tmp/input.mp3 /tmp/transcript.txt /tmp/segments.json /tmp/transcription-result.zip /tmp/recognizer.log
